[package]
name = "tminus"
version = "0.1.0"
description = "T-MINUS conditional conversion orders for Token-2022 PreStocks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tminus"

[features]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token_2022", "associated_token"] }
