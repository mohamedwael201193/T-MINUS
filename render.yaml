services:
  - type: web
    name: tminus-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@10.34.5 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @tminus/api typecheck && pnpm --filter @tminus/keeper typecheck
    startCommand: pnpm --filter @tminus/api start
    preDeployCommand: pnpm --filter @tminus/api migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: KEEPER_SEND_ENABLED
        value: "false"
      - key: KEEPER_EMBEDDED
        value: "true"
