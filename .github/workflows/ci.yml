name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://tminus:tminus@127.0.0.1:1/tminus
      DIRECT_URL: postgres://tminus:tminus@127.0.0.1:1/tminus
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      PROGRAM_ID: HRLmVcuk6PRcVwB3UVpcbEC3LVVMhdLZfPvHtmL2PUdL
      SPACEX_MINT: PreANxuXjsy2pvisWWMNB6YaJNzr7681wJJr2rHsfTh
      SPCXX_MINT: Xs3oZwbHvqis4NYcf4YKWmEia2eC84wSiVrcYcTqpH8
      KEEPER_KEYPAIR_PATH: /dev/null
      KEEPER_SPEND_CAP_RAW: "200000000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tminus/sdk test
      - run: pnpm --filter @tminus/api test
      - run: pnpm --filter @tminus/keeper test
      - run: pnpm --filter @tminus/sdk typecheck
      - run: pnpm --filter @tminus/api typecheck
      - run: pnpm --filter @tminus/keeper typecheck
      - run: node scripts/secret-scan.mjs
